name: pr-title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            ui
            config
            refactor
            style
            docs
            build
            ci
            chore
            revert
            test
          subjectPattern: ^[^A-Z].*$
          subjectPatternError: A descrição do título deve começar com letra minúscula.
      - name: título com até 66 caracteres (o squash soma " (#N)")
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ "$BASE" = "develop" ] && [ ${#TITLE} -gt 66 ]; then
            echo "O título tem ${#TITLE} caracteres; o limite é 66."
            exit 1
          fi
